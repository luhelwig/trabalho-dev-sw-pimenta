[project]
name = "gerador-musical"
version = "0.2.0"
description = "Gerador de música a partir de texto — INF01120 UFRGS"
requires-python = ">=3.10"
dependencies = ["mido>=1.3", "pygame-ce>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
